name: "fetch_reference_genome"
description: Fetch and cache an NCBI assembly's whole-genome FASTA, GFF3 annotation (when available) and metadata reports, via the NCBI Datasets CLI
keywords:
  - reference genome
  - annotation
  - ncbi
  - datasets
  - download
  - cache
tools:
  - "ncbi-datasets-cli":
      description: NCBI Datasets command-line tool for downloading genome assemblies, annotation and metadata
      homepage: https://www.ncbi.nlm.nih.gov/datasets/
      documentation: https://www.ncbi.nlm.nih.gov/datasets/docs/v2/reference-docs/command-line/datasets/
      licence: ["Public Domain"]

input:
  - - accession:
        type: string
        description: NCBI assembly accession (GCF_.../GCA_...)

output:
  - fasta:
      - "${accession}.fasta.gz":
          type: file
          description: Whole-assembly FASTA (all contigs/plasmids), gzipped
          pattern: "*.fasta.gz"
  - gff:
      - "${accession}.gff.gz":
          type: file
          description: Optional. GFF3 annotation for the assembly, gzipped, with the same sequence names as the FASTA. Absent for unannotated assemblies.
          pattern: "*.gff.gz"
  - assembly_report:
      - "${accession}.assembly_report.jsonl":
          type: file
          description: NCBI Datasets assembly data report (organism, taxid, assembly stats, annotation info)
          pattern: "*.assembly_report.jsonl"
  - sequence_report:
      - "${accession}.sequence_report.jsonl":
          type: file
          description: NCBI Datasets per-sequence report (accessions, roles, lengths)
          pattern: "*.sequence_report.jsonl"

authors:
  - "@dfornika"
maintainers:
  - "@dfornika"
