channels:
  - conda-forge
  - bioconda
dependencies:
  # speccheck isn't on bioconda; install the PyPI release. procps-ng provides
  # `ps`, which Nextflow's task wrapper requires inside containers whenever
  # trace/timeline/report is enabled (it is, by default) - the upstream
  # happykhan/speccheck image lacks it.
  - conda-forge::python=3.12
  - conda-forge::procps-ng
  - conda-forge::pip
  - pip:
      - speccheck-qc==1.3.0
